<style>
    form {
        max-width: 400px;
        margin-top: 70px;
        margin-left: 700px;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #f9f9f9;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input[type="text"],
    textarea {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }

    button {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        float: right;
    }

    button:hover {
        background-color: #45a049;
    }
</style>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <label for="id_phone_number">Phone Number:</label>
    {{ form.phone_number }}
    <label for="id_address">Address:</label>
    {{ form.address }}
    <label for="id_profile_picture">Profile Picture:</label>
    {{ form.profile_picture }}
    <button type="submit">Save</button>
</form>
