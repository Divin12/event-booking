<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
            body {
                display: block;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin-left: 600px;
                background-color: rgb(63, 136, 199); /* Add a light background color */
                width: 400px;
            }
    
            form {
                
                text-align: center;
                border: 1px solid black;
                border-radius: 10px;
                padding: 30px;
                background-color: #fff;
                margin-top: 10px;
               
            }
    
            h1 {
                text-align: center;
            }
    
            label {
                display: block;
                margin-bottom: 8px;
            }
    
            input[type="text"],
            input[type="email"],
            input[type="password"] {
                width: 100%;
                padding: 8px;
                margin-bottom: 10px;
                border: 1px solid black;
                border-radius: 5px;
            }
    
            input[type="submit"] {
                background-color: #008CBA;
                color: #fff;
                padding: 10px 8px;
                border: none;
                border-radius: 5px;
                cursor: pointer;

            }
    
            input[type="submit"]:hover {
                background-color: #005f6b;
            }
        </style>
    </style>
</head>
<body>
    <h1>Login</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.errors }}
        {{ form.non_field_errors }}
        {{ form }}
        <input type="submit"/>
    </form>
</body>
</html>
